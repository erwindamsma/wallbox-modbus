name: ci

# tools/selftest.py drives the real Modbus slave over a pty pair, so it needs
# no RS485 hardware and runs anywhere. It is the same command the README gives
# as step 1 of bring-up, which makes it exactly the thing to gate on: if this
# goes red, the first instruction we give a new user is broken.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        # What Debian bookworm ships, through to current. pyproject declares
        # >=3.10 as the floor.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    env:
      # The self test prints each check as it runs; unbuffered keeps that in
      # order with anything the logging module writes to stderr.
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install .

      - name: Self test
        run: python tools/selftest.py

      # The example config is the starting point for every new install, so a
      # change that invalidates it has to fail here rather than in someone's
      # meter cupboard. --dump-map exercises the full load-and-validate path.
      - name: The example config still parses
        run: python -m wallbox_powerboost -c config.example.yaml --dump-map
