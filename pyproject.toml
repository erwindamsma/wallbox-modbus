[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wallbox-powerboost"
description = "Emulate an INEPRO N1-CT energy meter over Modbus RTU so a Wallbox charger runs Power Boost and Eco-Smart without the accessory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Erwin Damsma" }]
requires-python = ">=3.10"
dynamic = ["version"]
keywords = ["wallbox", "power-boost", "modbus", "rs485", "inepro", "n1-ct",
            "home-assistant", "ev-charging", "load-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
dependencies = [
    "pyserial>=3.5",
    "aiohttp>=3.9",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/erwindamsma/wallbox-modbus"
Issues = "https://github.com/erwindamsma/wallbox-modbus/issues"

[project.scripts]
wallbox-powerboost = "wallbox_powerboost.__main__:main"

[tool.setuptools]
packages = ["wallbox_powerboost", "wallbox_powerboost.sources"]

[tool.setuptools.dynamic]
version = { attr = "wallbox_powerboost.__version__" }
