# Copy to config.yaml and edit.

serial:
  # CH340/FTDI show up as /dev/ttyUSB0, CH343/CH9102 as /dev/ttyACM0.
  # Check with: dmesg | tail
  port: /dev/ttyUSB0

  # Confirmed against a Pulsar Plus. The N1-CT manual says 9600/even, which is
  # wrong for this bus. Set both to "auto" if yours disagrees and the emulator
  # will find it and log what worked.
  baud: 19200       # auto, 9600, 19200
  parity: none      # auto, even, none, odd
  stopbits: 1
  unit_id: 1
  probe_seconds: 8

  # Only if your adapter needs RTS to key the transmitter.
  rts_direction_control: false
  rts_active_high: true
  # Only if it loops transmitted bytes back into the receiver.
  discard_echo: false

meter:
  # Must be 1. On three phases L2 and L3 would read 0 A and the charger would
  # draw freely on them, so it refuses to start instead.
  phases: 1

  # Used to convert power to current when no voltage sensor is set.
  nominal_voltage: 230.0

  # A real CT reports current unsigned and puts direction in the sign of power.
  # Switch to "signed" if the charger throttles while you export. Untested.
  current_sign: magnitude

  # What to answer for registers the N1-CT doesn't have. "zero" is permissive,
  # "exception" is what real hardware does. Start permissive.
  unknown_register_policy: zero

  # The systemd unit creates this via StateDirectory. Running from a shell,
  # point it somewhere you can write.
  energy_file: /var/lib/evse-meter/energy.json

  # What the charger reads once at startup to identify the meter. If Power
  # Boost never comes on, this block is the first place to look.
  identity:
    serial_number: 20250001
    # The gate. 0x0102 is accepted, 0x0103 is not, even though an N1-CT is a
    # CT meter. A list like [0x0102, 0x0103] tries both in one detection window.
    meter_code: 0x0102
    modbus_id: 1
    baud_code: 9600
    protocol_version: 1.0
    software_version: 1.17
    hardware_version: 1.0
    meter_amps: 100      # CT primary rating of a real N1-CT
    combination_code: 5  # forward + reverse
    parity_code: 1       # even
    software_crc: 0

limits:
  # Required. Your main fuse rating, in amps. Set the same number under Load
  # Management in the app. The charger enforces it, not this program.
  installation_current_a: 25.0

failsafe:
  # Report the failsafe current if no reading arrives for this long. Don't
  # raise it much: it's how long the charger may pull its maximum on data you
  # can no longer vouch for.
  max_data_age_s: 15

  # Must be above installation_current_a, or the charger reads it as "exactly
  # at the limit" and holds instead of backing off. Left out, it's 1.5x.
  #current_a: 37.5

source:
  # Only homeassistant so far. See CONTRIBUTING.md to add another.
  type: homeassistant

  url: http://homeassistant.local:8123
  # Profile -> Security -> Long-lived access tokens. Keep this file private.
  token: "PASTE_A_LONG_LIVED_ACCESS_TOKEN_HERE"

  mode: push          # push = WebSocket, poll = REST
  poll_interval_s: 1.0

  # Net grid power, positive importing. Find it with --list-entities, then
  # check the sign with --check-source before you wire anything.
  power_entity: sensor.p1_meter_active_power

  # Or a positive pair, subtracted. Only used if power_entity is unset.
  import_entity: null
  export_entity: null

  # Optional, improves the power-to-current conversion.
  voltage_entity: sensor.p1_meter_voltage_phase_l1

  # Only if the entity has no unit_of_measurement.
  power_unit: null    # W, kW

log_level: INFO
status_interval_s: 10
